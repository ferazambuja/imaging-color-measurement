<text class="body" x="190" y="712">directional relative-L2 difference</text>
<text class="body" x="74" y="741">530 + 540 nm: 75.9% of 36-band original / 40.1% of 35-band post-shift squared residual.</text>
<text class="small" x="74" y="760">35-band zero-offset baseline 4.33% → best fitted shift -0.95 nm: 3.08% (28.7% lower); no cause identified.</text>

<rect class="panel" x="786" y="108" width="372" height="200" rx="14"/>
