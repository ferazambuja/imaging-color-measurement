  <text x="78" y="406.00" text-anchor="end" class="axis">0</text>
  <line x1="88" y1="371.33" x2="844" y2="371.33" stroke="#d8dee8"/>
  <line x1="88" y1="340.67" x2="844" y2="340.67" stroke="#d8dee8"/>
  <text x="78" y="344.67" text-anchor="end" class="axis">2</text>
  <line x1="88" y1="310.00" x2="844" y2="310.00" stroke="#d8dee8"/>
  <line x1="88" y1="279.33" x2="844" y2="279.33" stroke="#d8dee8"/>
  <text x="78" y="283.33" text-anchor="end" class="axis">4</text>
  <line x1="88" y1="248.67" x2="844" y2="248.67" stroke="#d8dee8"/>
  <line x1="88" y1="218.00" x2="844" y2="218.00" stroke="#d8dee8"/>
  <text x="78" y="222.00" text-anchor="end" class="axis">6</text>
  <line x1="88" y1="187.33" x2="844" y2="187.33" stroke="#d8dee8"/>
