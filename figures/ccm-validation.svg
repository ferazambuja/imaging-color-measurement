  <text x="78" y="160.67" text-anchor="end" class="axis">8</text>
  <line x1="88" y1="126.00" x2="844" y2="126.00" stroke="#d8dee8"/>
  <rect x="137.50" y="276.30" width="42" height="125.70" rx="3" fill="#0f766e"/>
  <text x="158.50" y="269.30" text-anchor="middle" class="value">4.099</text>
  <rect x="185.50" y="275.22" width="42" height="126.78" rx="3" fill="#7c3aed"/>
  <text x="206.50" y="268.22" text-anchor="middle" class="value">4.134</text>
  <text x="182.50" y="426" text-anchor="middle" class="axis">All-patch</text>
  <text x="182.50" y="443" text-anchor="middle" class="axis">baseline</text>
  <text x="182.50" y="461" text-anchor="middle" class="axis">n=140</text>
  <rect x="326.50" y="304.79" width="42" height="97.21" rx="3" fill="#0f766e"/>
  <text x="347.50" y="297.79" text-anchor="middle" class="value">3.170</text>
  <rect x="374.50" y="303.22" width="42" height="98.78" rx="3" fill="#7c3aed"/>
  <text x="395.50" y="296.22" text-anchor="middle" class="value">3.221</text>
  <text x="371.50" y="426" text-anchor="middle" class="axis">Kept set (L*</text>
  <text x="371.50" y="443" text-anchor="middle" class="axis">&gt;= 25)</text>
  <text x="371.50" y="461" text-anchor="middle" class="axis">n=112</text>
  <rect x="539.50" y="275.47" width="42" height="126.53" rx="3" fill="#0f766e"/>
