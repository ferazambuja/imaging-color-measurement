  <rect x="470" y="467" width="12" height="12" rx="2" fill="#7c3aed"/>
  <text x="489" y="477" class="legend">5-fold held-out mean</text>
  <text x="44" y="528" class="subtitle">The kept-set reduction is reported as a flare-handling policy; excluded patches remain visible and do not show a better camera model.</text>
