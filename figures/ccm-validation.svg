<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">ColorChecker CCM validation summary</title>
  <desc id="desc">Bars compare mean CIEDE2000 for a corrected RAW patch table, a lightness-filtered kept set, all patches under the kept-set fit, and the excluded dark patches. Held-out values are shown where defined.</desc>
  <style>
    text { font-family: Helvetica; fill: #172033; }
    .title { font-size: 25px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #5f6b7a; }
    .panel-title { font-size: 16px; font-weight: 700; }
    .axis { font-size: 12px; fill: #5f6b7a; }
    .legend { font-size: 12px; }
    .value { font-size: 11px; font-weight: 600; }
    .node-title { font-size: 15px; font-weight: 700; }
    .node-detail { font-size: 12px; fill: #5f6b7a; }
  </style>
  <rect width="920" height="560" rx="16" fill="#ffffff"/>
  <text x="44" y="48" class="title">ColorChecker / CCM validation</text>
  <text x="44" y="74" class="subtitle">Corrected RAW patches · linear 3×3 RGB→XYZ model · lower CIEDE2000 is better</text>
  <rect x="36" y="98" width="848" height="390" rx="12" fill="#f7f9fc"/>
